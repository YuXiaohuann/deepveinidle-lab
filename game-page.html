<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the phone layout read safe-area insets so the
         bottom tab bar clears the home indicator; the rest is unchanged. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Deep Vein Idle</title>
    <!-- What a pasted link shows on Reddit, Discord and the rest: the square
         with people on it, and the one sentence that says what this is. -->
    <meta name="description" content="An idle MMO in the browser. One shared world seen from above: send your character to a rock, a lake or a monster and it works while you watch and while you sleep. Exact offline progress, no download, no signup needed." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Deep Vein Idle" />
    <meta property="og:title" content="Deep Vein Idle" />
    <meta property="og:description" content="An idle MMO where the person mining next to you is real. Browser, phone, exact offline progress. Play as a guest, no signup." />
    <meta property="og:url" content="https://deepveinidle.com/" />
    <meta property="og:image" content="https://deepveinidle.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deep Vein Idle" />
    <meta name="twitter:description" content="An idle MMO where the person mining next to you is real. Browser, phone, exact offline progress. Play as a guest, no signup." />
    <meta name="twitter:image" content="https://deepveinidle.com/og.png" />
    <!-- The game as an app: a manifest for the home screen, the panel colour
         behind the browser chrome, and the iOS tags Safari still wants. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1c1f23" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque, not translucent: translucent makes iOS size the view as if the
         status bar were opaque but place it under the bar anyway, leaving a
         status-bar-sized hole at the bottom (measured: viewport 812 on an 874
         screen). Black keeps the view below the bar and flush with the bottom. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Deep Vein Idle" />
    <script type="module" crossorigin src="/assets/index-CEociSeB.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-ggxXUKTI.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
