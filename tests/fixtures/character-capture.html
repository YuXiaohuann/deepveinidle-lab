<!doctype html><meta charset="utf-8"><title>角色捕获本地验证</title>
<style>body{font:16px system-ui;background:#171c24;color:#e6d6ae;padding:32px}pre{white-space:pre-wrap}button{padding:8px}</style>
<h1>角色捕获本地验证</h1><p>直接捕获、合成游戏消息、模拟 GM 存储；不连接游戏。</p><pre id="results">验证中…</pre>
<script type="module">
const results=[],out=document.querySelector('#results'),storage=new Map(),writes=[];
let release,holdKey,hold=false,callbackMax=0;
const page=new EventTarget();page.WebSocket=class extends EventTarget{
 receive(m,tick=100){const raw=JSON.stringify({tick,m}),start=performance.now();this.dispatchEvent(new MessageEvent('message',{data:raw}));callbackMax=Math.max(callbackMax,performance.now()-start);}
 send(){throw Error('No game commands');}
};
async function save(key,value){writes.push({key,value});if(hold&&key===holdKey){hold=false;await new Promise(r=>release=r);}storage.set(key,structuredClone(value));}
const key='dvi-character-snapshot-v2',mk='dvi-market-quotes-v1';
const you=(n,large=false)=>({lastTick:n,skills:{melee:n},equipment:{weapon:null},bank:{64:20},pack:[],overflow:{},collections:{64:1},forgeLog:{0:1},unusedHistory:large?Array(100000).fill('ignored history'):[],password:'secret'});
const wait=async check=>{const until=performance.now()+5000;while(!check()){if(performance.now()>until)throw Error('condition timed out');await new Promise(r=>setTimeout(r,20));}};
function ok(condition,label){if(!condition)throw Error(label);results.push(label);out.textContent=JSON.stringify({passed:results,callbackMaxMs:callbackMax},null,2);}
try{
 const source=await (await fetch('/candidate.js')).text();
 new Function('unsafeWindow','location','GM_setValue','Worker','Blob',source)(page,{origin:'https://deepveinidle.com',host:'deepveinidle.com',href:'https://deepveinidle.com/'},save,undefined,undefined);
 const s=new page.WebSocket('wss://deepveinidle.com/ws');s.receive([{t:'welcome',you:you(100,true),guild:{name:'Test',tag:'T'},windows:[]}]);
 await wait(()=>storage.has(key));ok(storage.get(key).player.unusedHistory===undefined&&storage.get(key).player.password===undefined&&storage.get(key).player.forgeLog[0]===1,'角色裁剪并保留精通及库存字段');
 const before=writes.length;
 for(let i=0;i<100;i++)s.receive([{t:'marketBook',top:{itemId:i+1,bid:i+1}},{t:'marketBooks',tops:[]},{t:'marketDepth',itemId:1,bids:[]}]);
 await new Promise(r=>setTimeout(r,150));ok(writes.length===before&&!storage.has(mk),'市场消息不写入角色或市场缓存');
 hold=true;holdKey=key;s.receive([{t:'snapshot',you:you(200)}]);await wait(()=>release);
 const pendingWrites=writes.length;
 for(let i=0;i<100;i++)s.receive([{t:'snapshot',you:you(201+i)}]);
 await new Promise(r=>setTimeout(r,150));ok(writes.length===pendingWrites,'慢存储期间不保存中间角色快照');release();release=null;
 await wait(()=>storage.get(key).player.lastTick===300);ok(writes.length===pendingWrites+1,'慢存储结束后保存最新角色');
 hold=true;holdKey=key;s.receive([{t:'snapshot',you:you(400)}]);await wait(()=>release);
 const second=new page.WebSocket('wss://deepveinidle.com/ws');second.receive([{t:'welcome',you:you(500),guild:null,windows:[]}]);release();release=null;
 await wait(()=>storage.get(key).player.lastTick===500);ok(storage.get(key).guild===null&&!storage.has(mk),'跨连接旧写入后保存新角色，不生成市场缓存');
 second.receive([{t:'snapshot',you:{}}]);ok(document.querySelector('#dvi-character-capture')?.textContent.includes('Incompatible character data'),'角色结构异常明确显示失败');
 page.dispatchEvent(new Event('pagehide'));results.push('PASS');out.textContent=JSON.stringify({passed:results,callbackMaxMs:callbackMax,writes:writes.length,environment:navigator.userAgent},null,2);
}catch(e){out.textContent=JSON.stringify({passed:results,error:e.message,stack:e.stack,badge:document.querySelector('#dvi-character-capture')?.textContent},null,2);}
</script>
